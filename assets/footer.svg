<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 96" width="100%" role="img" aria-labelledby="t">
  <title id="t">Keep building. Keep learning. Keep growing.</title>
  <style>
    .sans { font-family: "Plus Jakarta Sans", Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .q { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
    @keyframes glow { 0%, 100% { opacity: .35; } 33% { opacity: 1; } }
    .w1 { animation: glow 4.5s ease-in-out infinite; }
    .w2 { animation: glow 4.5s ease-in-out 1.5s infinite; }
    .w3 { animation: glow 4.5s ease-in-out 3s infinite; }
    @media (prefers-reduced-motion: reduce) { .w1, .w2, .w3 { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="839" height="95" rx="18" fill="#15130f" stroke="#3a342c"/>
  <text class="sans q" x="420" y="55" text-anchor="middle" fill="#f7f1e7"><tspan class="w1">keep building<tspan fill="#f4a261">.</tspan></tspan> <tspan class="w2">keep learning<tspan fill="#f4a261">.</tspan></tspan> <tspan class="w3">keep growing<tspan fill="#f4a261">.</tspan></tspan></text>
</svg>
