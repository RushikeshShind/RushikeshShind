<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 236" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Experience timeline</title>
  <desc id="d">ISparx Infotech, Software Developer Full Stack, July 2024 to August 2025. Vunya Infotech, Software Development Consultant, August 2025 to March 2026. AMSUN Universe LLP, Software Developer, March 2026 to present.</desc>
  <style>
    .sans { font-family: "Plus Jakarta Sans", Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .when { font-size: 11px; letter-spacing: 1.2px; fill: #f4a261; }
    .co { font-size: 18px; font-weight: 700; letter-spacing: -.4px; fill: #f7f1e7; }
    .role { font-size: 13px; fill: #bdb3a4; }
    .note { font-size: 12px; fill: #6f685e; }
    @keyframes draw { from { stroke-dashoffset: 760; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes ping { 0% { r: 6px; opacity: .7; } 100% { r: 18px; opacity: 0; } }
    .track { stroke-dasharray: 760; animation: draw 2s ease-out both; }
    .s1 { animation: rise .7s ease-out .2s both; }
    .s2 { animation: rise .7s ease-out .8s both; }
    .s3 { animation: rise .7s ease-out 1.4s both; }
    .ping { animation: ping 2s ease-out 2s infinite; }
    @media (prefers-reduced-motion: reduce) { .track, .s1, .s2, .s3, .ping { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="839" height="235" rx="18" fill="#15130f" stroke="#3a342c"/>

  <path d="M40 62 H800" stroke="#3a342c" stroke-width="2" stroke-linecap="round"/>
  <path class="track" d="M40 62 H800" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/>

  <g class="s1">
    <circle cx="46" cy="62" r="6" fill="#15130f" stroke="#f4a261" stroke-width="2"/>
    <text class="mono when" x="40" y="104">JUL 2024 — AUG 2025</text>
    <text class="sans co" x="40" y="134">ISparx Infotech</text>
    <text class="sans role" x="40" y="156">Software Developer, Full Stack</text>
    <text class="sans note" x="40" y="186">5+ web apps in Angular, Next.js, Node</text>
    <text class="sans note" x="40" y="204">4+ deploys on AWS, Vercel, Render</text>
  </g>

  <g class="s2">
    <circle cx="312" cy="62" r="6" fill="#15130f" stroke="#f4a261" stroke-width="2"/>
    <text class="mono when" x="306" y="104">AUG 2025 — MAR 2026</text>
    <text class="sans co" x="306" y="134">Vunya Infotech</text>
    <text class="sans role" x="306" y="156">Software Development Consultant</text>
    <text class="sans note" x="306" y="186">Web and mobile builds for clients</text>
    <text class="sans note" x="306" y="204">Angular, React, REST APIs, cloud</text>
  </g>

  <g class="s3">
    <circle class="ping" cx="578" cy="62" r="6" fill="#f4a261"/>
    <circle cx="578" cy="62" r="6" fill="#f4a261"/>
    <text class="mono when" x="572" y="104">MAR 2026 — PRESENT</text>
    <text class="sans co" x="572" y="134">AMSUN Universe LLP</text>
    <text class="sans role" x="572" y="156">Software Developer</text>
    <text class="sans note" x="572" y="186">College ERP and Number Aacharya</text>
    <text class="sans note" x="572" y="204">One-person team: web, Android, iOS</text>
  </g>
</svg>
